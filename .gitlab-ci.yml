stages:
  - check
  - test

default:
  image: rust:1.97
  # 共享 runner 42（Kubernetes，标签只有 linux）在拉取代码时总是报
  # `could not lock config file //.gitconfig`，与项目无关。用 h3c 标签限定到 runner 46（docker）
  # 或 47（shell）；runner 42 修好后可去掉。
  tags:
    - h3c
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - unknown_failure
  cache:
    key: cargo-$CI_JOB_NAME
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

fmt:
  stage: check
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --locked -- -D warnings

# M0 验收：Android 依赖树里不能有 OpenSSL / TLS / C 构建依赖，且能通过类型检查。
# 完整链接（.so）需要 NDK，在本地或后续的 Android 镜像里做。
android-deps:
  stage: check
  script:
    - rustup target add aarch64-linux-android
    # 只检查 core 和 CLI：桥接层（app/rust）经 flutter_rust_bridge → dart-sys 需要 cc 编译 Dart API 桩代码，
    # 由 Flutter 构建时的 NDK / MSVC / gcc 提供，属于预期；但 core 必须保持纯 Rust、无 TLS。
    - cargo tree -e normal,build --target aarch64-linux-android --locked --prefix none -p guanxiang-core -p guanxiang-cli > tree.txt
    - |
      if grep -Ei '^(openssl|openssl-sys|native-tls|ring|rustls|ureq|reqwest|cc|cmake|bindgen) ' tree.txt; then
        echo "发现原生依赖或 TLS 依赖"; exit 1
      fi
    - cargo check -p guanxiang-core -p guanxiang-cli --target aarch64-linux-android --locked

test:
  stage: test
  cache:
    - key: cargo-test
      paths:
        - .cargo-home/registry/index/
        - .cargo-home/registry/cache/
        - target/
    - key: ephemeris-de440s
      paths:
        - data/de440s.bsp
  variables:
    # runner 不能访问外网，星历放在本项目的 Generic Package Registry（ephemeris/de440/de440s.bsp）
    DE440S_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ephemeris/de440/de440s.bsp
    DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
  script:
    - |
      if ! echo "$DE440S_SHA256  data/de440s.bsp" | sha256sum -c --status 2>/dev/null; then
        curl -fsSL --retry 3 -H "JOB-TOKEN: $CI_JOB_TOKEN" -o data/de440s.bsp "$DE440S_URL" \
          || curl -fsSL --retry 3 --connect-timeout 20 -o data/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
        echo "$DE440S_SHA256  data/de440s.bsp" | sha256sum -c
      fi
    - |
      set -o pipefail
      cargo test --workspace --locked -- --nocapture 2>&1 | tee test.log
    # 星历测试在找不到文件时会跳过；CI 中不允许跳过
    - '! grep -q "跳过：找不到" test.log'
    # App 打包的裁剪星历（1900–2100）必须能从 de440s 复现，且范围内位置逐位一致（工具内校验）
    - cargo run -q --locked -p guanxiang-core --example trim_spk -- data/de440s.bsp data/de440s_1900_2100.bsp 1899-12-01 2101-02-01
    - echo "1b7ff150cbc00d364f584ad65dad651129fde4ab2e7aa23f9551dc9b9674afaa  data/de440s_1900_2100.bsp" | sha256sum -c

# 官网（website/）：改动 website/ 时构建；main 分支上再用 wrangler 发布到 Cloudflare。
# 发布需要在 GitLab「设置 → CI/CD → 变量」里配置 CLOUDFLARE_API_TOKEN（受保护、隐藏），
# 账号 ID 已写在 website/wrangler.jsonc。没有配置时只构建不发布。
# 参考 https://developers.cloudflare.com/workers/ci-cd/external-cicd/gitlab-cicd/
.website:
  image: node:24-slim
  cache:
    key: website-npm
    paths:
      - website/.npm/
  before_script:
    - cd website
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  rules:
    - changes:
        - website/**/*
        - .gitlab-ci.yml

website-build:
  extends: .website
  stage: check
  script:
    - npm run build
  artifacts:
    paths:
      - website/dist/
    expire_in: 1 week

website-deploy:
  extends: .website
  stage: test
  needs: [website-build]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      changes:
        - website/**/*
        - .gitlab-ci.yml
  script:
    - npx wrangler deploy

# 发布镜像：推 v* 标签时，把 Generic Package Registry 里该版本的安装包同步到 Cloudflare R2
# （桶 huxulm-asia 的 guanxiang/<版本>/，公开地址 https://s2.huxulm.dev/guanxiang/<版本>/），
# 并生成 SHA256SUMS。官网从这里下载，因为 GitLab 项目是私有的。
# 需要 CI/CD 变量 R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（R2 的 S3 API 令牌，建议只授权这个桶）。
# 发版顺序：先把安装包传到包仓库，再推标签。
release-mirror:
  stage: test
  image:
    name: rclone/rclone:1.75.0
    entrypoint: [""]
  cache: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $R2_ACCESS_KEY_ID && $R2_SECRET_ACCESS_KEY'
  variables:
    RCLONE_CONFIG_R2_TYPE: s3
    RCLONE_CONFIG_R2_PROVIDER: Cloudflare
    RCLONE_CONFIG_R2_ENDPOINT: https://945740d1b097841869dbae6bba8f8353.r2.cloudflarestorage.com
    RCLONE_CONFIG_R2_REGION: auto
    RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    R2_DEST: r2:huxulm-asia/guanxiang
  script:
    - export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/guanxiang/$VERSION"
    - mkdir -p "out/$VERSION" && cd "out/$VERSION"
    - |
      for f in arm64-v8a.apk x86_64.apk windows-x64-setup.exe windows-x64.zip; do
        name="guanxiang-$VERSION-$f"
        rclone copyurl --header "JOB-TOKEN: $CI_JOB_TOKEN" "$PKG/$name" "$name"
        test -s "$name"
      done
    - sha256sum guanxiang-* > SHA256SUMS && cat SHA256SUMS
    - cd .. && rclone copy --checksum -v --exclude SHA256SUMS "$VERSION" "$R2_DEST/$VERSION"
    # 校验值文件按文本返回，浏览器里能直接看
    - rclone copyto --no-check-dest --header-upload "Content-Type: text/plain; charset=utf-8" "$VERSION/SHA256SUMS" "$R2_DEST/$VERSION/SHA256SUMS"
    # 校验公开地址能下载、内容一致
    - |
      for name in $(cut -d' ' -f3 "$VERSION/SHA256SUMS") SHA256SUMS; do
        rclone copyurl "https://s2.huxulm.dev/guanxiang/$VERSION/$name" "check-$name"
        cmp "check-$name" "$VERSION/$name"
      done
