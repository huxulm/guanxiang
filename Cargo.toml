[workspace]
resolver = "3"
members = ["crates/guanxiang-core", "crates/guanxiang-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
guanxiang-core = { path = "crates/guanxiang-core" }
# D2：只用 anise 读星历。关掉默认 feature（metaload 会引入 ureq/TLS，analysis 会引入 rayon 等）。
anise = { version = "1.0.0-beta", default-features = false }
# D3：时间尺度、岁差章动、坐标变换。
sofars = "0.6.2"
# D4：卫星预报（OMM 优先）。
sgp4 = "2.4.0"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
