[package]
name = "rust_lib_guanxiang"
description = "观象 Flutter 桥接层（flutter_rust_bridge），只做类型转换和进度回传"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
guanxiang-core.workspace = true
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
