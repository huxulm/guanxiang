# 发布镜像：GitHub Release 发布后，把附件里的 4 个安装包同步到 Cloudflare R2
# （桶 huxulm-asia 的 guanxiang/<版本>/，公开地址 https://s2.huxulm.dev/guanxiang/<版本>/），
# 生成 SHA256SUMS，校验公开地址能下载且内容一致，然后部署官网。
# 需要仓库 Secrets：R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（R2 的 S3 API 令牌）、CLOUDFLARE_API_TOKEN（官网）。
# 也可以手动运行，重新同步某个已发布的版本。
name: Release mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的 Release 标签，如 v0.1.8
        required: true

permissions:
  contents: read

concurrency:
  group: release-mirror-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  RCL_RELEASE: v1.75.0  # 不要用 RCLONE_ 开头：rclone 会把 RCLONE_* 环境变量当成参数（RCLONE_VERSION 即 --version）
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://945740d1b097841869dbae6bba8f8353.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_REGION: auto
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  R2_DEST: r2:huxulm-asia/guanxiang

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 检查标签格式
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "标签格式不对：$TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: 安装 rclone
        run: |
          curl -fsSL --retry 3 -o rclone.zip "https://downloads.rclone.org/$RCL_RELEASE/rclone-$RCL_RELEASE-linux-amd64.zip"
          unzip -q rclone.zip
          sudo install "rclone-$RCL_RELEASE-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1
      - name: 下载 Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "out/$VERSION" && cd "out/$VERSION"
          for f in arm64-v8a.apk x86_64.apk windows-x64-setup.exe windows-x64.zip; do
            name="guanxiang-$VERSION-$f"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name"
            test -s "$name"
          done
          sha256sum guanxiang-* > SHA256SUMS
          cat SHA256SUMS
      - name: 同步到 R2
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          cd out
          rclone copy --checksum -v --exclude SHA256SUMS "$VERSION" "$R2_DEST/$VERSION"
          # 校验值文件按文本返回，浏览器里能直接看
          rclone copyto --no-check-dest --header-upload "Content-Type: text/plain; charset=utf-8" "$VERSION/SHA256SUMS" "$R2_DEST/$VERSION/SHA256SUMS"
      - name: 校验公开地址
        run: |
          cd out
          for name in $(cut -d' ' -f3 "$VERSION/SHA256SUMS") SHA256SUMS; do
            curl -fsSL --retry 3 -o "check-$name" "https://s2.huxulm.dev/guanxiang/$VERSION/$name"
            cmp "check-$name" "$VERSION/$name"
          done
          echo "已同步：https://s2.huxulm.dev/guanxiang/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  website:
    needs: mirror
    uses: ./.github/workflows/website.yml
    secrets: inherit
