# 发布：GitHub Release 发布后，在这里构建全部安装包并上传到 Release：
#   - android（ubuntu-latest）：arm64-v8a、x86_64 两个 APK，用发布证书签名，签完核对证书指纹
#   - windows（windows-latest）：Inno Setup 7 安装程序和免安装 zip
#   - linux（ubuntu-22.04）：.deb，并做安装、启动冒烟测试
# 三端共用 ephemeris 任务从 de440s 生成并校验的裁剪星历。然后把 5 个安装包同步到 Cloudflare R2
# （桶 huxulm-asia 的 guanxiang/<版本>/，公开地址 https://s2.huxulm.dev/guanxiang/<版本>/），
# 生成 SHA256SUMS，校验公开地址能下载且内容一致，再部署官网。
# 同时把 docs/releases/<标签>.md 写回 Release 正文（notes 任务）。
#
# 需要仓库 Secrets：
#   R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（R2 的 S3 API 令牌）、CLOUDFLARE_API_TOKEN（官网）
#   ANDROID_KEYSTORE_BASE64（发布签名密钥 jks 的 base64）、ANDROID_STORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
#
# 也可以手动运行：重新构建、同步某个已发布的版本；勾选“试运行”时只构建，安装包作为本次运行的
# artifact 保存，不碰 Release、R2 和官网（用来验证构建流程）。
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release 标签，如 v0.1.11
        required: true
      dry_run:
        description: 试运行（只构建，不上传到 Release、不同步 R2、不部署官网）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run == true }}
  RCL_RELEASE: v1.75.0  # 不要用 RCLONE_ 开头：rclone 会把 RCLONE_* 环境变量当成参数（RCLONE_VERSION 即 --version）
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://945740d1b097841869dbae6bba8f8353.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_REGION: auto
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  R2_DEST: r2:huxulm-asia/guanxiang
  RUST_TOOLCHAIN: "1.97"
  FLUTTER_VERSION: "3.47.9"
  DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
  TRIMMED_SHA256: 1b7ff150cbc00d364f584ad65dad651129fde4ab2e7aa23f9551dc9b9674afaa

jobs:
  # Release 正文以仓库里的 docs/releases/<标签>.md 为准（随版本号一起提交），发布后写回 Release。
  # 重跑旧版本时如果没有这个文件，保留 Release 现有的说明。
  notes:
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: 用仓库里的说明更新 Release 正文
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="docs/releases/$TAG.md"
          if [ ! -f "$f" ]; then
            echo "::warning::$f 不存在，保留 Release 现有的说明"
            exit 0
          fi
          python3 tools/release_notes.py check "${TAG#v}"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$f"

  # App 打包的裁剪星历（1900–2100）：从 de440s 生成，必须与固定的 SHA-256 一致，三端共用
  ephemeris:
    runs-on: ubuntu-latest
    steps:
      - name: 检查标签格式
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "标签格式不对：$TAG"; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: 版本号要与标签一致
        # 含“冒号加空格”，必须用块标量，否则 YAML 解析失败
        run: |
          grep -q "^version: ${TAG#v}+" app/pubspec.yaml || { echo "app/pubspec.yaml 的版本不是 ${TAG#v}"; exit 1; }
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: 星历缓存
        uses: actions/cache@v4
        with:
          path: data/de440s.bsp
          key: ephemeris-de440s-${{ env.DE440S_SHA256 }}
      - name: 生成 App 用的裁剪星历
        run: |
          if ! echo "$DE440S_SHA256  data/de440s.bsp" | sha256sum -c --status 2>/dev/null; then
            curl -fsSL --retry 3 -o data/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
            echo "$DE440S_SHA256  data/de440s.bsp" | sha256sum -c
          fi
          cargo run -q --locked -p guanxiang-core --example trim_spk -- data/de440s.bsp de440s_1900_2100.bsp 1899-12-01 2101-02-01
          echo "$TRIMMED_SHA256  de440s_1900_2100.bsp" | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: ephemeris-trimmed
          path: de440s_1900_2100.bsp
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    needs: ephemeris
    permissions:
      contents: write
    env:
      # 与 app/android/app/build.gradle.kts 的 ndkVersion 一致
      NDK_VERSION: 30.0.16248370
      # 发布证书的 SHA-256（历次 Release 说明里写的就是它）；签出来的包必须是这张证书
      CERT_SHA256: be424a5ac6fb3bc335856bb6b2251384e5c16d9b8a2641d2b4727f85b6aa4db5
    steps:
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: ephemeris-trimmed
          path: app/assets
      # 发布脚本取自本工作流所在的提交（试运行旧标签时，标签里可能还没有这些脚本）
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools
          path: ci-tools
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Rust（Android 目标）
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t aarch64-linux-android -t x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"
      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 发布签名密钥
        # 密钥只写到本次运行的临时目录；没有配置 Secrets 时直接失败，不会退回调试签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::缺少 Android 签名 Secret（$v）"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
      - name: flutter build apk
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - name: 核对签名证书并改名
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [ "$digest" = "$CERT_SHA256" ] || { echo "::error::$abi 的签名证书不对：$digest"; exit 1; }
            cp "$apk" "dist/guanxiang-$VERSION-$abi.apk"
          done
          ls -l dist
      - name: 删除签名密钥
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/upload.jks"
      - name: 上传到 Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci-tools/tools/release_upload.sh "$TAG" dist/*.apk
      - if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guanxiang-android
          path: dist/*.apk
          retention-days: 7

  windows:
    runs-on: windows-latest
    needs: ephemeris
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    steps:
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: ephemeris-trimmed
          path: app/assets
      # 发布脚本取自本工作流所在的提交（试运行旧标签时，标签里可能还没有这些脚本）
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools
          path: ci-tools
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 安装 Inno Setup 7
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/innosetup.exe" "$INNO_URL"
          echo "$INNO_SHA256  $RUNNER_TEMP/innosetup.exe" | sha256sum -c
      - name: 安装 Inno Setup 7（静默）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\InnoSetup7'
          if ($p.ExitCode -ne 0) { throw "Inno Setup 安装失败：$($p.ExitCode)" }
          if (-not (Test-Path 'C:\InnoSetup7\ISCC.exe')) { throw '没有找到 ISCC.exe' }
      - name: flutter build windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: 安装程序和免安装 zip
        run: |
          (cd app && /c/InnoSetup7/ISCC.exe windows/installer.iss)
          mkdir -p dist
          cp "app/build/windows/installer/guanxiang-$VERSION-windows-x64-setup.exe" dist/
          python ci-tools/tools/package_windows.py app/build/windows/x64/runner/Release "dist/guanxiang-$VERSION-windows-x64.zip"
          ls -l dist
      - name: 上传到 Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci-tools/tools/release_upload.sh "$TAG" dist/*
      - if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guanxiang-windows
          path: dist/*
          retention-days: 7

  linux:
    # 在较旧的系统上构建：GLib/glibc 只向后兼容，24.04 上构建的程序在 22.04 上会缺 g_once_init_enter_pointer
    runs-on: ubuntu-22.04
    needs: ephemeris
    permissions:
      contents: write
    steps:
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: ephemeris-trimmed
          path: app/assets
      # 发布脚本取自本工作流所在的提交（试运行旧标签时，标签里可能还没有这些脚本）
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools
          path: ci-tools
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Linux 构建依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter build linux
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - name: 打包并做冒烟测试
        run: |
          pkg=$(bash tools/package_linux.sh "$GITHUB_WORKSPACE/dist")
          test "$(basename "$pkg")" = "guanxiang-$VERSION-linux-amd64.deb"
          bash tools/smoke_linux.sh "$pkg"
      - name: 上传到 Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci-tools/tools/release_upload.sh "$TAG" dist/*.deb
      - if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guanxiang-linux
          path: dist/*.deb
          retention-days: 7

  mirror:
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    steps:
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: 安装 rclone
        run: |
          curl -fsSL --retry 3 -o rclone.zip "https://downloads.rclone.org/$RCL_RELEASE/rclone-$RCL_RELEASE-linux-amd64.zip"
          unzip -q rclone.zip
          sudo install "rclone-$RCL_RELEASE-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1
      - name: 下载 Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "out/$VERSION" && cd "out/$VERSION"
          for f in arm64-v8a.apk x86_64.apk windows-x64-setup.exe windows-x64.zip linux-amd64.deb; do
            name="guanxiang-$VERSION-$f"
            # GitHub API 偶尔返回 500，失败时重试
            for i in 1 2 3 4; do
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" --clobber && break
              [ "$i" -lt 4 ] || exit 1
              echo "下载 $name 失败，15 秒后重试（第 $i 次）"
              sleep 15
            done
            test -s "$name"
          done
          sha256sum guanxiang-* > SHA256SUMS
          cat SHA256SUMS
      - name: 同步到 R2
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          cd out
          rclone copy --checksum -v --exclude SHA256SUMS "$VERSION" "$R2_DEST/$VERSION"
          # 校验值文件按文本返回，浏览器里能直接看
          rclone copyto --no-check-dest --header-upload "Content-Type: text/plain; charset=utf-8" "$VERSION/SHA256SUMS" "$R2_DEST/$VERSION/SHA256SUMS"
      - name: 校验公开地址
        run: |
          cd out
          for name in $(cut -d' ' -f3 "$VERSION/SHA256SUMS") SHA256SUMS; do
            curl -fsSL --retry 3 -o "check-$name" "https://s2.huxulm.dev/guanxiang/$VERSION/$name"
            cmp "check-$name" "$VERSION/$name"
          done
          echo "已同步：https://s2.huxulm.dev/guanxiang/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  website:
    needs: mirror
    uses: ./.github/workflows/website.yml
    secrets: inherit
