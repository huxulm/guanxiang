# GitHub 镜像（huxulm/guanxiang）上的检查。主仓库在 GitLab，部署官网和同步 R2 只在 GitLab CI 做，
# 这里只跑检查：与 .gitlab-ci.yml 的 fmt、clippy、android-deps、test、website-build 对应，
# 另加 GitLab runner 跑不了的 flutter analyze / flutter test。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.97"
  FLUTTER_VERSION: "3.47.9"
  DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
  TRIMMED_SHA256: 1b7ff150cbc00d364f584ad65dad651129fde4ab2e7aa23f9551dc9b9674afaa

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt && rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Android 依赖树里不能有 OpenSSL / TLS / C 构建依赖（只查 core 和 CLI，桥接层需要 cc 属于预期）
  android-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo tree -e normal,build --target aarch64-linux-android --locked --prefix none -p guanxiang-core -p guanxiang-cli > tree.txt
      - run: |
          if grep -Ei '^(openssl|openssl-sys|native-tls|ring|rustls|ureq|reqwest|cc|cmake|bindgen) ' tree.txt; then
            echo "发现原生依赖或 TLS 依赖"; exit 1
          fi
      - run: cargo check -p guanxiang-core -p guanxiang-cli --target aarch64-linux-android --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: 星历缓存
        uses: actions/cache@v4
        with:
          path: data/de440s.bsp
          key: ephemeris-de440s-${{ env.DE440S_SHA256 }}
      - name: 下载 de440s
        run: |
          if ! echo "$DE440S_SHA256  data/de440s.bsp" | sha256sum -c --status 2>/dev/null; then
            curl -fsSL --retry 3 -o data/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
            echo "$DE440S_SHA256  data/de440s.bsp" | sha256sum -c
          fi
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --workspace --locked -- --nocapture 2>&1 | tee test.log
      # 星历测试在找不到文件时会跳过；CI 中不允许跳过
      - run: '! grep -q "跳过：找不到" test.log'
      # App 打包的裁剪星历（1900–2100）必须能从 de440s 复现
      - name: 生成裁剪星历
        run: |
          cargo run -q --locked -p guanxiang-core --example trim_spk -- data/de440s.bsp data/de440s_1900_2100.bsp 1899-12-01 2101-02-01
          echo "$TRIMMED_SHA256  data/de440s_1900_2100.bsp" | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: ephemeris-trimmed
          path: data/de440s_1900_2100.bsp
          retention-days: 3

  # 星历 asset 不进 Git，用 test 任务生成的裁剪版
  flutter:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ephemeris-trimmed
          path: app/assets
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  website-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
